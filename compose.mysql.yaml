services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: BDeventos
      MYSQL_ALLOW_EMPTY_PASSWORD: "${MYSQL_ALLOW_EMPTY_PASSWORD:-yes}"
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3308}:3306"
    volumes:
      - eventpass-eventos-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--host=127.0.0.1", "--user=root", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  eventpass-eventos-mysql-data:
