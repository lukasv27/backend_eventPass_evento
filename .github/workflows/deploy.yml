name: Pipeline CI/CD Completo - EventPass Java 17

on:
  push:
    branches: [main]

jobs:
  ci-build-and-test:
    name: 1. Integracion Continua (Build, Test & Artifact)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: BDeventos
        ports:
          - 3308:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17 (Amazon Corretto)
        uses: actions/setup-java@v4
        with:
          distribution: "corretto"
          java-version: "17"
          cache: "maven"

      - name: Ejecutar pruebas unitarias (JUnit)
        run: mvn test
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3308/BDeventos
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root

      - name: Empaquetar aplicacion (.jar)
        run: mvn package -DskipTests

      - name: Guardar artefacto compilado en GitHub
        uses: actions/upload-artifact@v4
        with:
          name: eventpass-jar
          path: target/*.jar
          if-no-files-found: error
