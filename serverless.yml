service: ms-eventpass-eventos-serverless

provider:
  name: aws
  runtime: java17
  region: us-east-1
  memorySize: 3008
  timeout: 29

  iam:
    role: arn:aws:iam::966861314356:role/LabRole

  environment:
    SPRING_MAIN_LAZY_INITIALIZATION: "true"
    JAVA_TOOL_OPTIONS: >-
      -XX:+TieredCompilation
      -XX:TieredStopAtLevel=1
      --add-opens=java.base/java.lang=ALL-UNNAMED

    SPRING_DATASOURCE_URL: "jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=USER"
    SPRING_DATASOURCE_DRIVER_CLASS_NAME: "org.h2.Driver"
    SPRING_DATASOURCE_USERNAME: "sa"
    SPRING_DATASOURCE_PASSWORD: ""
    SPRING_JPA_HIBERNATE_DDL_AUTO: "update"

    LOGGING_FILE_NAME: "/tmp/eventpass.log"

package:
  artifact: target/eventos-0.0.1-SNAPSHOT.jar

functions:
  api:
    handler: Event_pass.eventos.StreamLambdaHandler::handleRequest
    events:
      - httpApi: "*"
